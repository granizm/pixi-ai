[package]
name = "pixi-ai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pixi-ai"
path = "src/main.rs"

[package.metadata.bundle]
name = "Pixi AI"
identifier = "com.granizm.pixi-ai"
category = "public.app-category.productivity"
short_description = "Pixi AI"
osx_info_plist_exts = ["crates/app/info_plist_ext.plist"]

[dependencies]
renderer = { path = "../renderer" }
vrm = { path = "../vrm" }
solver = { path = "../solver" }
tracker = { path = "../tracker" }
virtual-camera = { path = "../virtual-camera" }
video-decoder = { path = "../video-decoder" }
pipeline-logger = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
nokhwa = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
lua-imgui = { path = "../lua-imgui" }

[package.metadata.deb]
name = "pixi-ai"
maintainer = "granizm"
copyright = "2024, granizm"
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/pixi-ai", "usr/bin/pixi-ai", "755"],
    ["../../assets/**/*", "usr/share/pixi-ai/assets/", "644"],
]
